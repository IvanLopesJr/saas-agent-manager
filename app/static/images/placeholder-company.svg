<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#f0f0f0"/>
  
  <!-- Building icon -->
  <g transform="translate(50, 40)">
    <rect x="0" y="20" width="100" height="100" fill="#ccc" stroke="#999" stroke-width="2"/>
    
    <!-- Windows -->
    <rect x="10" y="30" width="15" height="15" fill="#999"/>
    <rect x="35" y="30" width="15" height="15" fill="#999"/>
    <rect x="60" y="30" width="15" height="15" fill="#999"/>
    <rect x="10" y="55" width="15" height="15" fill="#999"/>
    <rect x="35" y="55" width="15" height="15" fill="#999"/>
    <rect x="60" y="55" width="15" height="15" fill="#999"/>
    <rect x="10" y="80" width="15" height="15" fill="#999"/>
    <rect x="60" y="80" width="15" height="15" fill="#999"/>
    
    <!-- Door -->
    <rect x="35" y="85" width="15" height="35" fill="#777"/>
    
    <!-- Roof -->
    <polygon points="50,0 0,20 100,20" fill="#999"/>
  </g>
  
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">
    Logo da Empresa
  </text>
</svg>
