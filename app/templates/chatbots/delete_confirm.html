{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        <h5 class="mb-0">{% trans "Confirmar Exclusão" %}</h5>
    </div>
    <div class="card-body">
        <p class="alert alert-warning">
            <i class="bi bi-exclamation-triangle-fill"></i>
            {% trans "Tem certeza que deseja deletar o chatbot" %} <strong>{{ chatbot.name }}</strong>?
        </p>
        <p>{% trans "Esta ação não pode ser desfeita." %}</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <a href="{% url 'chatbot_list' %}" class="btn btn-secondary">
                    {% trans "Cancelar" %}
                </a>
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> {% trans "Sim, Deletar" %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
