{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="page-header">
    <h1>{% trans "Alterar Senha" %}</h1>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        {% trans "Sua senha deve conter pelo menos 8 caracteres." %}
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_old_password" class="form-label">{% trans "Senha Atual" %}</label>
                        <input type="password" name="old_password" class="form-control" id="id_old_password" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_new_password1" class="form-label">{% trans "Nova Senha" %}</label>
                        <input type="password" name="new_password1" class="form-control" id="id_new_password1" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_new_password2" class="form-label">{% trans "Confirmar Nova Senha" %}</label>
                        <input type="password" name="new_password2" class="form-control" id="id_new_password2" required>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'user_profile' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> {% trans "Cancelar" %}
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> {% trans "Alterar Senha" %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
